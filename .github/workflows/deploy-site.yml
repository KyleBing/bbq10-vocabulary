name: Build & Deploy Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android platform / build-tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Grant gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if ./gradlew :app:assembleDebug --no-daemon --stacktrace; then
              exit 0
            fi
            echo "Build attempt ${attempt} failed; clearing incomplete Gradle downloads and retrying..."
            find "${HOME}/.gradle/wrapper/dists" -name '*.part' -delete 2>/dev/null || true
            find "${HOME}/.gradle/wrapper/dists" -name '*.lck' -delete 2>/dev/null || true
            sleep $((attempt * 10))
          done
          exit 1

      - name: Prepare download site
        run: |
          chmod +x scripts/prepare_site.py
          python3 scripts/prepare_site.py "${{ github.sha }}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Upload site artifact (wordbooks; APK offline on Pages)
        uses: actions/upload-artifact@v4
        with:
          name: site-files
          path: |
            site/index.html
            site/wordbooks/*.db

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
